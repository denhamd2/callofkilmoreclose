; Export presets for Call of Kilmore Close.
;
; Two presets: Android (the constrained target) and Linux/X11 desktop.
;
; IMPORTANT — this file configures the presets, it does not by itself make the
; project exportable. Before the Android preset will build you must also, once,
; on your own machine:
;
;   1. Install OpenJDK 17 and the Android SDK (see godot/README.md).
;   2. Point Godot at them: Editor > Editor Settings > Export > Android,
;      set `Java SDK Path` and `Android SDK Path`. These are EDITOR settings,
;      stored per-machine, which is exactly why they are not in this file.
;   3. Install the export templates: Editor > Manage Export Templates.
;   4. Generate a debug keystore, and set it in the same Editor Settings page.
;
; The keystore fields below are deliberately left EMPTY. A keystore path is
; machine-specific and a keystore password must never be committed; Godot reads
; both from the editor settings, or from the GODOT_ANDROID_KEYSTORE_* environment
; variables in CI.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/kilmore-close.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; Gradle build is OFF. The prebuilt export template is the simpler path and is
; all this project needs — a custom Gradle build is only required for Android
; plugins, custom Java/Kotlin, or a trimmed template. Turning it on also
; introduces the whole Gradle toolchain as a failure surface. Leave it off
; until something actually needs it.
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""

; ARM64 only. Every Android device sold in years is arm64-v8a, and Google Play
; has required a 64-bit build since 2019. Shipping armeabi-v7a as well roughly
; doubles the native payload for a slice of devices this game would not run on
; anyway. Add it back if a specific target device turns out to be 32-bit.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

version/code=1
version/name="0.1.0"
package/unique_name="com.kilmoreclose.game"
package/name="Kilmore Close"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

; Landscape, and let the device sleep rules alone.
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; The launcher icon slots. Left empty: Godot substitutes its own default icon,
; which is honest for a pre-alpha slice. Point these at a 432x432 and a 192x192
; PNG when there is real art.
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""

graphics/opengl_debug=false

; No permissions at all. This game reads no files, uses no network, no camera,
; no location. Every permission left off here is one fewer thing for a store
; review or a player to question.
permissions/internet=false

xr_features/xr_mode=0

[preset.1]

name="Linux/X11"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/linux/kilmore-close.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
